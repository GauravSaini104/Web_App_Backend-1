# Save as: .github/workflows/deploy.yml  (backend repo)
# Secrets needed: SSH_HOST, SSH_USER, SSH_KEY
#
# Strategy: BUILD on GitHub (plenty of RAM), SHIP the compiled dist/ to the server,
# then migrate + restart there. If the new version is unhealthy, auto-rollback.
name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # ---------- 1. Build on the runner ----------
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run build

      - name: Verify build output
        run: |
          ls -la dist
          test -f dist/main.js || test -f dist/src/main.js || { echo "No main.js in dist/"; exit 1; }

      # ---------- 2. Prepare the server ----------
      - name: Prepare server (code, swap, .env check)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            APP=/var/www/backend
            REPO_URL="https://github.com/${{ github.repository }}.git"

            # swap (one-time) so npm ci never gets OOM-killed
            if ! swapon --show | grep -q /swapfile; then
              [ -f /swapfile ] || { fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile; }
              swapon /swapfile || true
              grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
            fi

            [ -d $APP/.git ] || git clone "$REPO_URL" $APP
            cd $APP
            git remote set-url origin "$REPO_URL"
            git fetch origin main
            git reset --hard origin/main

            [ -f .env ] || { echo "ERROR: $APP/.env is missing"; exit 1; }
            rm -rf dist_new && mkdir -p dist_new

      # ---------- 3. Upload compiled output ----------
      - name: Upload dist/
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete
          path: dist/
          remote_path: /var/www/backend/dist_new/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}

      # ---------- 4. Migrate, switch, restart, verify, rollback if needed ----------
      - name: Release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/backend
            set -a; source .env; set +a
            PORT="${PORT:-3000}"

            # database up + healthy
            docker compose up -d
            for i in $(seq 1 30); do
              docker ps --format '{{.Names}} {{.Status}}' | grep -q 'healthy' && break
              sleep 2
            done

            # dependencies + prisma (a failure here stops the release, app keeps running old code)
            npm ci --no-audit --no-fund
            npx prisma generate
            npx prisma migrate deploy

            # switch dist (keep previous for rollback)
            rm -rf dist.prev
            [ -d dist ] && mv dist dist.prev
            mv dist_new dist

            # restart
            if pm2 describe grocery-api > /dev/null 2>&1; then
              pm2 restart grocery-api --update-env
            else
              pm2 start npm --name grocery-api -- run start:prod
            fi
            pm2 save

            # health check: any real HTTP answer that is not 000/5xx = up
            healthy() {
              for i in $(seq 1 20); do
                CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${PORT}/health" || true)
                if [ "$CODE" != "000" ] && [ "${CODE:0:1}" != "5" ]; then
                  echo "App is up (HTTP $CODE)"; return 0
                fi
                sleep 2
              done
              return 1
            }

            if healthy; then
              echo "Deploy OK"
              exit 0
            fi

            echo "New version unhealthy. Recent logs:"
            pm2 logs grocery-api --lines 60 --nostream || true

            if [ -d dist.prev ]; then
              echo "Rolling back to previous build..."
              rm -rf dist.failed && mv dist dist.failed
              mv dist.prev dist
              pm2 restart grocery-api --update-env
              sleep 5
            fi
            exit 1
