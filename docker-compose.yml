services:
  postgres:
    image: postgres:16-alpine
    container_name: grocery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grocery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grocery}
      POSTGRES_DB: ${POSTGRES_DB:-grocery_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - grocery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grocery}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  grocery_postgres_data:
